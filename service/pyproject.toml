[project]
name = "tempo-service"
version = "0.1.0"
description = "Tempo local search service (FastAPI sidecar for After Effects CEP panel)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "opencv-python==4.10.0.84",
    "scenedetect==0.6.4",
    "torch==2.4.1",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    "faster-whisper==1.0.3",
    "easyocr==1.7.2",
    "scikit-learn==1.5.2",
    "faiss-cpu==1.8.0",
    "rank-bm25==0.2.2",
    "keyring==25.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempo_service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
