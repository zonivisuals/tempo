[project]
name = "tempo-service"
version = "0.1.0"
description = "Tempo sidecar: registry, engine handoff and search proxy for the After Effects CEP panel"
requires-python = ">=3.11"
# No models, no scoring: indexing and search run on the engine (ADR-0008).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempo_service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
