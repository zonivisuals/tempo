<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tempo</title>
<!-- ?v= cache buster: CEF caches panel assets aggressively across AE
     restarts; bump on any www/ change so the installed panel reloads. -->
<link rel="stylesheet" href="panel.css?v=0.2.0">
</head>
<body>
<div id="app">
  <div id="statusbar">
    <span id="svc">service…</span>
    <span id="backend">backend…</span>
    <span id="sync-summary"></span>
    <button id="sync-now" type="button">Sync now</button>
  </div>
  <div id="searchrow">
    <input id="q" type="text" placeholder="Search footage…" autocomplete="off">
    <select id="footage-filter" hidden></select>
  </div>
  <div id="footage-actions"></div>
  <div id="jobs"></div>
  <div id="results"></div>
  <div id="error" hidden></div>
  <details id="debugbox"><summary>debug (copy-paste)</summary><pre id="debug">boot…</pre></details>
</div>
<script src="../CSXS/CSInterface.js"></script>
<script src="api.js?v=0.2.0"></script>
<script src="panel.js?v=0.2.0"></script>
</body>
</html>
