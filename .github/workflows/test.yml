name: test

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service (pinned + dev)
        run: pip install ./service "./service[dev]"
      - name: Run service tests
        run: python -m pytest service/tests -q
